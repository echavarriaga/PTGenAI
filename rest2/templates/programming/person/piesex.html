<div class="container py-3">
   <header>
      <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
         <a href="" class="d-flex align-items-center link-body-emphasis text-decoration-none" onclick="PRHO.openPage('page-main')">
           <a href="" class="d-flex align-items-center link-body-emphasis text-decoration-none" >
           <div class="p-1" onclick=""><i class="fa-solid fa-chess-rook fa-2x text-secondary"></i></div>
           <span class="ms-2 fs-4 text-secondary fw-semibold">Portable Programming</span>
         </a>
       </div>
   </header>
 
   <div class="sticky-top h3 bg-white p-3"><center><b>Persons Statistics</b></center></div>
   <div>
      <canvas class="my-4" id="sexChart"  style="max-height: 400px;"></canvas>
   </div>
</div>

<script type="text/javascript">
(function () {
  'use strict'

   // Graphs
   var ctx = document.getElementById('sexChart');
   // eslint-disable-next-line no-unused-vars
   var myChart = new Chart(ctx, {
   type: 'pie',
   data: {
      labels: [
      {{#each Rows}}{{#xif 'this.SEX == "F"'}}'Mujeres',{{else}}'Hombres',{{/xif}}{{/each}}   
      ],
      datasets: [{
         data: [
         {{#each Rows}}{{this.TOTAL}},{{/each}} 
         ],
         backgroundColor: [
            'rgb(255, 99, 132)',
            'rgb(54, 162, 235)'
         ]
      }]
   },
   options: {
      responsive: true,
      plugins: {
         legend: {
            position: 'bottom',
         }
      }
      }
   });
})()
   
</script>
